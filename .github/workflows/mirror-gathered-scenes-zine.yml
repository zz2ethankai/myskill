name: Mirror gathered-scenes-zine skill

on:
  push:
    paths:
      - .github/workflows/mirror-gathered-scenes-zine.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact upstream snapshot
        shell: bash
        run: |
          rm -rf /tmp/gathered-scenes-zine-skill
          git clone --no-checkout https://github.com/Zeejay0/gathered-scenes-zine-skill.git /tmp/gathered-scenes-zine-skill
          git -C /tmp/gathered-scenes-zine-skill checkout 55a2ce1875f485268ebef5eeb6f1450f2fbb02cc
          rm -rf gathered-scenes-zine
          mkdir -p gathered-scenes-zine
          rsync -a --exclude='.git' /tmp/gathered-scenes-zine-skill/ gathered-scenes-zine/

      - name: Commit exact mirror
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gathered-scenes-zine
          if ! git diff --cached --quiet; then
            git commit -m "Add gathered-scenes-zine skill"
            git push
          fi
